{% extends 'base-login.html' %}

{% block title %}Selecionar Cursos{% endblock %}

{% block conteudo %}
    <h2>Selecione até três cursos para se candidatar.</h2>
    <a href="{{ url_for('geral.index') }}">Pular</a>

    <div id="itens">
        {% for curso in cursos %}
            <div id="item-{{ curso.id }}" class="item" onclick="alternarCurso('{{ curso.id }}')">
                <p>{{ curso.nome }}</p>
                <p>{{ curso.horario }}</p>
                <p>{{ curso.duracao }}</p>
                <p class="ordem-texto" style="font-weight: bold; color: #0056b3;"></p>
            </div>
        {% endfor %}
    </div>

    <button id="selecionar" onclick="SelecionarCursos()" disabled>Selecionar</button>
{% endblock %}

<script>
    let cursosSelecionados = []

    function alternarCurso(id) {
        const index = cursosSelecionados.indexOf(id)

        if (index !== -1) {
            cursosSelecionados.splice(index, 1)
        } else {
            if (cursosSelecionados.length < 3) {
                cursosSelecionados.push(id)
            } else {
                return 
            }
        }
        atualizarTela()
    }

    function atualizarTela() {
        document.querySelectorAll('.item').forEach(item => {
            item.style.border = ""
            item.querySelector('.ordem-texto').innerText = ""
        })

        cursosSelecionados.forEach((id, index) => {
            const item = document.getElementById(`item-${id}`)
            if (item) {
                item.style.border = "2px solid #0056b3"
                item.querySelector('.ordem-texto').innerText = `${index + 1}ª Opção`
            }
        })

        const botao = document.getElementById('selecionar')
        botao.disabled = cursosSelecionados.length === 0
    }

    function SelecionarCursos() {
        const opcao1 = cursosSelecionados[0] || 0
        const opcao2 = cursosSelecionados[1] || 0
        const opcao3 = cursosSelecionados[2] || 0
        
        let urlFinal = "{{ url_for('candidato.selecionar_curso', id_primeira_opcao='OP1', id_segunda_opcao='OP2', id_terceira_opcao='OP3') }}"
        urlFinal = urlFinal.replace('OP1', opcao1).replace('OP2', opcao2).replace('OP3', opcao3)
        
        window.location.href = urlFinal
    }
</script>
