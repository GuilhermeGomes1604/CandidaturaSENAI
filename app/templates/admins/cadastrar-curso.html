{% extends 'base-login.html' %}

{% block title %} Cadastrar Curso {% endblock %}

{% block conteudo %}
    <div>
        <form id="form" action="{{ url_for('admin.cadastrar_curso') }}" method="POST">
            <label>Nome:<input type="text" name="nome"></label>
            <label>Sigla:<input type="text" name="sigla"></label>
            <label>Horário:
                <select name="horario">
                    <option value="">Selecione o horário do curso</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Noite">Noite</option>
                </select>
            </label>
            <label>Detalhamento:<input type="text" name="detalhamento"></label>
            <label>Idade Mínima:<input type="number" name="idade-minima"></label>
            <label>Duração:
                <select name="duracao">
                    <option value="">Selecione a duração do curso</option>
                    <option value="1">1 mês</option>
                    <option value="12">1 ano</option>
                    <option value="18">1 ano e meio</option>
                    <option value="24">2 anos</option>
                </select>
            </label>
            <label>Vagas:<input type="number" name="vagas"></label>
        
            <button type="submit">Cadastrar</button>
        </form>
    </div>
{% endblock %}

<script>
    document.getElementById('form').addEventListener('submit', function(event) { 
        const nome = document.getElementsByName('nome').value
        const sigla = document.getElementsByName('sigla').value
        const horario = document.getElementsByName('horario').value
        const detalhamento = document.getElementsByName('detalhamento').value
        const idadeMinima = document.getElementsByName('idade-minima').value
        const duracao = document.getElementsByName('duracao').value
        const vagas = document.getElementsByName('vagas').value

        if (!nome || !sigla || !horario || !detalhamento || !idadeMinima || !duracao || !vagas) {
            event.preventDefault()
            alert("Por favor, preencha todos os campos obrigatórios.")
            return
        }
    })

</script>
