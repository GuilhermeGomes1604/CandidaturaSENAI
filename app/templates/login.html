{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block main %}
    <div class="titulos-login">
        <h1>Candidatura SENAI</h1>
        <h2>Login</h2>
    </div>
    
    <div id="container">
        <form id="form" action="{{ url_for('geral.login') }}" method="POST">
            <label for="">CPF/CNPJ:</label>
            <input type="text" name="login" maxlength="18" placeholder="Digite seu CPF/CNPJ" onkeyup="this.value=formatarCPFCNPJ(this.value)" >

            <label for="">Senha:</label>
            <div class="senha-container">
                <input id="input-senha" type="password" name="senha" placeholder="Digite sua senha">
                <button type="button" id="alternar-visibilidade-senha" onclick="alternarVisibilidadeSenha(event)">
                    <img id="icone-visibilidade-senha" src="{{ url_for('static', filename='img/icone_olho_aberto.png') }}" alt="Mostrar Senha">
                </button>
            </div>
            
            <a href="{{ url_for('geral.esqueci_senha') }}">Esqueci minha senha</a>

            <div class="form-buttons">
                <button type="submit" class="btn-primario">Entrar</button>
            </div>
        </form>
        <a href="{{ url_for('geral.cadastro') }}">Ainda não tem uma conta? Crie uma!</a>
    </div>
    
    <script>
        document.getElementById('form').addEventListener('submit', function(event) {
            const login = document.getElementsByName('login')[0]
            const senha = document.getElementsByName('senha')[0]
            const caracteresLogin = login.value.length
            const caracteresSenha = senha.value.length
            
            if (caracteresLogin !== 14 && caracteresLogin !== 18) {
                event.preventDefault()
                alert("Insira um CPF/CNPJ válido.")
                login.focus()
            } else if (caracteresSenha == 0) {
                event.preventDefault()
                alert("Insira uma senha.")
                senha.focus()
            } else if (caracteresSenha < 8) {
                event.preventDefault()
                alert("A senha deve ser ter no mínimo 8 caracteres.")
                senha.focus()
            }
        })

        function formatarCPFCNPJ(valor) {
            valor = valor.replace(/\D/g, '')

            if (valor.length <= 11) {
                valor = valor.replace(/(\d{3})(\d)/, '$1.$2')
                valor = valor.replace(/(\d{3})(\d)/, '$1.$2')
                valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2')
            } else {
                valor = valor.substring(0, 14) 
                valor = valor.replace(/(\d{2})(\d)/, '$1.$2')
                valor = valor.replace(/(\d{3})(\d)/, '$1.$2')
                valor = valor.replace(/(\d{3})(\d)/, '$1/$2')
                valor = valor.replace(/(\d{4})(\d)/, '$1-$2')
            }
            
            return valor
        }

        function alternarVisibilidadeSenha(event) {
            if (event) event.preventDefault()
            const inputSenha = document.getElementById('input-senha')
            const img = document.getElementById('icone-visibilidade-senha')
            if (inputSenha.type === "password") {
                inputSenha.type = "text"
                img.src = "{{ url_for('static', filename='img/icone_olho_fechado.png') }}"
            } else {
                inputSenha.type = "password"
                img.src = "{{ url_for('static', filename='img/icone_olho_aberto.png') }}"
            }
        }
    </script>
{% endblock %}
