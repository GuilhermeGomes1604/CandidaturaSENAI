{% extends 'base-login.html' %}

{% block title %}Cursos{% endblock %}

{% block conteudo %}
    <div id="container-busca-filtros">
        <input type="text" name="pesquisa" id="pesquisa" placeholder="Pesquise um curso específico..." onchange="atualizarPagina()">
        <button onclick="atualizarPagina()"><img src="{{ url_for('static', filename='img/icone_pesquisar.png') }}" alt="Pesquisar"></button>

        <select name="status" id="status" onchange="atualizarPagina()">
            <option value="" selected>Todos</option>
            <option value="Ativo">Somente cursos ativos</option>
            <option value="Inativo">Somente cursos inativos</option>
        </select>

        <select name="horario" id="horario" multiple onchange="atualizarPagina()">
            <option value="" selected>Selecione horários</option>
            <option value="Manhã">Manhã</option>
            <option value="Tarde">Tarde</option>
            <option value="Noite">Noite</option>
        </select>

        <h3 id="numero-resultados">Buscando cursos...</h3>
    </div>

    <div id="itens"></div>

    <script>
        const selectHorario = document.getElementById('horario')

        selectHorario.addEventListener('mousedown', function (e) {
            e.preventDefault()
            const clicada = e.target

            if (clicada.tagName === 'OPTION' && !clicada.disabled) {
                clicada.selected = !clicada.selected
                const opcaoPadrao = selectHorario.querySelector('option[value=""]')
                if (opcaoPadrao) {
                    opcaoPadrao.disabled = true
                    opcaoPadrao.selected = false
                }
                selectHorario.dispatchEvent(new Event('change'))
            }
        })
        
        function atualizarPagina() {
            const container = document.getElementById('itens')
            const h3Resultados = document.getElementById('numero-resultados')

            const pesquisa = document.getElementById('pesquisa').value
            const status = document.getElementById('status').value
            const horarios = Array.from(document.getElementById('horario').selectedOptions).map(opcao => opcao.value)
            
            const urlBase = "{{ url_for('geral.api_dados_cursos') }}"
            const parametros = new URLSearchParams()

            if (pesquisa) parametros.append('pesquisa', pesquisa)
            if (status) parametros.append('status', status)
            horarios.forEach(turno => {
                if (turno) parametros.append('horario', turno)
            })
            
            const urlFinal = `${urlBase}?${parametros.toString()}`

            fetch(urlFinal)
            .then(response => {
                if (!response.ok) throw new Error(`Erro HTTP ${response.status}`)
                return response.json()
            })
            .then(dados => {
                container.innerHTML = ''
                
                if (!dados || !dados.cursos || dados.cursos.length === 0) {
                    h3Resultados.textContent = "Nenhum resultado encontrado."
                    container.innerHTML = '<h3>Nenhum curso encontrado com estes filtros.</h3>'
                    return
                }
                
                if (dados.cursos.length === 1) {
                    h3Resultados.textContent = "1 resultado encontrado."
                } else {
                    h3Resultados.textContent = `${dados.cursos.length} resultados encontrados.`
                }

                const baseUrlCurso = "{{ url_for('geral.curso', id=0) }}".replace('0', '')
                
                {% if session.get('tipo') == 'admin' %}
                    const baseUrlEdicao = "{{ url_for('admin.edicao_curso', id=0) }}".replace('0', '')
                {% endif %}

                dados.cursos.forEach((curso, index) => {
                    const item = document.createElement('a')
                    const classe = curso.status === 'Ativo' ? 'ativo' : 'inativo'
                    
                    item.id = `a-item-${index + 1}`
                    item.href = baseUrlCurso + curso.id
                    
                    let botoesAdmin = ""
                    {% if session.get('tipo') == 'admin' %}
                        botoesAdmin = `
                            <a href="${baseUrlEdicao + curso.id}">Editar</a>
                            <a onclick="event.preventDefault(), excluirCurso('${curso.id}', '${curso.nome}', ${index + 1})" style="cursor: pointer">Excluir</a>
                        `
                    {% endif %}

                    item.innerHTML = `
                    <div id="item-${index + 1}" class="item-${classe}">
                        <p>ID: ${curso.id}</p>
                        <h4>${curso.nome} (${curso.sigla})</h4>
                        <p>${curso.horario}</p>
                        <p>Idade Mínima: ${curso.idade_minima} anos</p>
                        <p>Duração: ${curso.duracao}</p>
                        <p>Vagas: ${curso.vagas}</p>
                        <p>${curso.data_registro}</p>
                        <p>${curso.status}</p>
                        ${botoesAdmin}
                    </div>
                    `
                    container.appendChild(item)
                })
            })
            .catch(erro => {
                h3Resultados.textContent = "Erro ao carregar os cursos."
                container.innerHTML = `<h3>Falha de comunicação com o servidor. Verifique o console (F12) para detalhes.</h3>`
            })
        }

        function excluirCurso(id, nome, index) {
            let resposta = confirm(`Deseja mesmo excluir o curso ${nome}?`)
            if (resposta) {
                const urlExcluir = "{{ url_for('admin.excluir_curso', id=0) }}".replace('0', id)
                
                fetch(urlExcluir, { method: 'POST' })
                .then(response => {
                    if(response.ok) {
                        const itemToRemove = document.getElementById(`a-item-${index}`)
                        if(itemToRemove) itemToRemove.remove()
                        atualizarPagina()
                    } else {
                        alert("Erro ao excluir o curso.")
                    }
                })
            }
        }

        document.addEventListener("DOMContentLoaded", atualizarPagina)
    </script>
{% endblock %}
